[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-research-agent"
version = "0.1.0"
description = "A small, checkpointed research agent with a deterministic evaluation harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research-agent = "research_agent.cli:main"
research-agent-ui = "research_agent.web:main"

[tool.setuptools.packages.find]
where = ["src"]
